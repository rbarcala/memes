<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestor de Clips (v1.3)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #e1e1e1; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .badge-ver { background: #28a745; color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
    a.back { color: #888; text-decoration: none; font-size: 0.9rem; }
    a.back:hover { color: #fff; }

    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #fff; border-bottom: 1px solid #2a2a2a; padding-bottom: 6px; }

    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 12px; background: #282828; border: 1px solid #444; border-radius: 6px; color: #fff; margin-bottom: 12px; font-size: 0.9rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    button { background: #2b2b2b; color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
    button:hover { background: #383838; }
    button.primary { background: #e50914; border-color: #e50914; font-weight: 600; }
    button.primary:hover { background: #b80710; }
    button.save { background: #238636; border-color: #2ea043; width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; margin-top: 10px; }
    button.save:hover { background: #2ea043; }

    /* Avisos visuales en página (Cero alerts nativos) */
    .banner { padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 12px; display: none; }
    .banner.err { background: #4c1d1d; color: #f85149; border: 1px solid #da3633; }
    .banner.ok { background: #1e4620; color: #7ee787; border: 1px solid #2ea043; }

    /* Área del reproductor */
    #preview-area { margin-top: 10px; display: none; }
    .preview-box { width: 100%; height: 340px; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 10px; position: relative; }
    .preview-box iframe { width: 100%; height: 100%; border: none; }
    .capture-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
    .capture-buttons button { flex: 1; background: #333; }

    /* Lista */
    .clip-row { display: flex; align-items: center; justify-content: space-between; background: #242424; padding: 10px 12px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #333; cursor: grab; }
    .clip-row.dragging { opacity: 0.4; }
    .clip-data { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .clip-actions { display: flex; gap: 6px; }
    .btn-icon { padding: 4px 8px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Panel de Administración <span class="badge-ver">v1.3</span></h1>
      <a href="index.html" class="back">← Ver Reproductor</a>
    </header>

    <!-- Credenciales GitHub -->
    <div class="card">
      <h2>1. Conexión con GitHub</h2>
      <div class="grid-2">
        <div>
          <label>Usuario / Organización:</label>
          <input type="text" id="gh-owner" placeholder="ej: rbarcala">
        </div>
        <div>
          <label>Repositorio:</label>
          <input type="text" id="gh-repo" placeholder="ej: mis-clips">
        </div>
      </div>
      <label>Personal Access Token (con permiso 'Contents: Read and write'):</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button onclick="saveGHConfig()">Guardar en navegador</button>
        <span id="config-status" style="font-size:0.8rem; color:#7ee787;"></span>
      </div>
    </div>

    <!-- Cargar / Editar Clip -->
    <div class="card">
      <h2 id="form-mode-title">2. Agregar o Editar Clip</h2>
      <input type="hidden" id="editing-index" value="-1">

      <div id="form-alert" class="banner"></div>
      
      <label>URL o ID de YouTube: (*obligatorio)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="clip-url" placeholder="Pegá cualquier link de YouTube (normal, /live/, /shorts/, youtu.be o ID)" oninput="onUrlPaste()">
        <button type="button" style="height: fit-content; white-space: nowrap;" onclick="loadPreview()">Cargar Video</button>
      </div>

      <!-- Preview interactivo con captura de tiempo -->
      <div id="preview-area">
        <div class="preview-box" id="player-mount-point"></div>
        <div class="capture-buttons">
          <button type="button" onclick="captureTimestamp('start')">⏱️ Fijar segundo actual como INICIO</button>
          <button type="button" onclick="captureTimestamp('end')">⏱️ Fijar segundo actual como FIN</button>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Título del Clip: <span style="color:#777;">(opcional)</span></label>
          <input type="text" id="clip-title" placeholder="Si lo dejás vacío se asigna automáticamente">
        </div>
        <div>
          <label>Categoría / Tag: <span style="color:#777;">(opcional)</span></label>
          <input type="text" id="clip-category" placeholder="General">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Inicio (MM:SS o segundos): (*obligatorio)</label>
          <input type="text" id="clip-start" placeholder="ej: 13:49 o 829">
        </div>
        <div>
          <label>Fin (MM:SS o segundos): (*obligatorio)</label>
          <input type="text" id="clip-end" placeholder="ej: 23:03 o 1383">
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="primary" id="btn-submit" onclick="submitClipForm()">➕ Guardar en Lista</button>
        <button type="button" id="btn-cancel-edit" style="display:none;" onclick="cancelEdit()">Cancelar Edición</button>
      </div>
    </div>

    <!-- Lista y Guardado -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2>3. Lista de Clips (<span id="total-count">0</span>)</h2>
        <div>
          <button onclick="exportJSON()" style="font-size:0.75rem;">📥 Descargar JSON</button>
        </div>
      </div>
      <p style="font-size:0.8rem; color:#888; margin-bottom:10px;">Arrastrá los clips o usá las flechas para ordenar la lista.</p>
      
      <div id="clips-drag-list">Cargando clips...</div>

      <button class="save" onclick="syncWithGitHub()">💾 Publicar Cambios en GitHub Pages</button>
      <div id="sync-status" class="banner" style="margin-top:10px;"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let clips = [];
    let fileSha = null;
    let adminPlayer = null;
    let isYtApiReady = false;

    window.onYouTubeIframeAPIReady = function() {
      isYtApiReady = true;
    };

    // Cargar config guardada
    document.getElementById('gh-owner').value = localStorage.getItem('c_owner') || '';
    document.getElementById('gh-repo').value = localStorage.getItem('c_repo') || '';
    document.getElementById('gh-token').value = localStorage.getItem('c_token') || '';

    function showFormMsg(msg, isError = true) {
      const el = document.getElementById('form-alert');
      el.style.display = 'block';
      el.className = isError ? 'banner err' : 'banner ok';
      el.innerText = msg;
    }

    function clearFormMsg() {
      document.getElementById('form-alert').style.display = 'none';
    }

    function saveGHConfig() {
      localStorage.setItem('c_owner', document.getElementById('gh-owner').value.trim());
      localStorage.setItem('c_repo', document.getElementById('gh-repo').value.trim());
      localStorage.setItem('c_token', document.getElementById('gh-token').value.trim());
      document.getElementById('config-status').innerText = '✓ Guardado localmente';
      loadClipsData();
    }

    function parseTime(val) {
      if (!val) return 0;
      const str = val.toString().trim();
      if (str.includes(':')) {
        const p = str.split(':').map(Number);
        if (p.length === 2) return (p[0] || 0) * 60 + (p[1] || 0);
        if (p.length === 3) return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0);
      }
      return parseInt(str, 10) || 0;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Extractor universal (soporta /live/, /shorts/, watch?v=, youtu.be o ID directo de 11 caracteres)
    function extractId(url) {
      if (!url) return '';
      const str = url.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
      const m = str.match(/(?:v=|\/live\/|\/shorts\/|\/embed\/|\/v\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : '';
    }

    async function onUrlPaste() {
      clearFormMsg();
      const id = extractId(document.getElementById('clip-url').value);
      if (id && !document.getElementById('clip-title').value.trim()) {
        try {
          const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
          if (res.ok) {
            const data = await res.json();
            if (data.title && !document.getElementById('clip-title').value.trim()) {
              document.getElementById('clip-title').value = data.title;
            }
          }
        } catch (e) {}
      }
    }

    function loadPreview() {
      clearFormMsg();
      const id = extractId(document.getElementById('clip-url').value);
      if (!id) {
        return showFormMsg('URL o ID no reconocido. Pegá un enlace válido de YouTube.');
      }

      document.getElementById('preview-area').style.display = 'block';

      // Reiniciar contenedor para evitar bloqueos del reproductor
      const mount = document.getElementById('player-mount-point');
      mount.innerHTML = '<div id="yt-admin-iframe"></div>';

      function initPlayer() {
        adminPlayer = new YT.Player('yt-admin-iframe', {
          videoId: id,
          height: '100%',
          width: '100%',
          playerVars: { controls: 1, rel: 0 },
          events: {
            'onError': function(e) {
              const errMap = {
                2: 'El ID del video no es válido.',
                5: 'Error de reproducción HTML5.',
                100: 'El video no existe o es privado.',
                101: 'El autor del video bloqueó la reproducción embebida fuera de YouTube.',
                150: 'El autor del video bloqueó la reproducción embebida fuera de YouTube.'
              };
              showFormMsg('Aviso YouTube: ' + (errMap[e.data] || 'No se pudo reproducir este video.'), true);
            }
          }
        });
      }

      if (window.YT && window.YT.Player) {
        initPlayer();
      } else {
        const checkReady = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(checkReady);
            initPlayer();
          }
        }, 100);
      }
    }

    function captureTimestamp(type) {
      if (!adminPlayer || !adminPlayer.getCurrentTime) {
        return showFormMsg('Cargá y reproducí el video primero para capturar el tiempo.');
      }
      clearFormMsg();
      const sec = Math.floor(adminPlayer.getCurrentTime());
      if (type === 'start') document.getElementById('clip-start').value = formatTime(sec);
      if (type === 'end') document.getElementById('clip-end').value = formatTime(sec);
    }

    function submitClipForm() {
      clearFormMsg();
      const editIdx = parseInt(document.getElementById('editing-index').value);
      const rawUrl = document.getElementById('clip-url').value;
      const id = extractId(rawUrl);
      let title = document.getElementById('clip-title').value.trim();
      const category = document.getElementById('clip-category').value.trim() || 'General';

      const rawStart = document.getElementById('clip-start').value;
      const rawEnd = document.getElementById('clip-end').value;

      if (!rawUrl || !id) {
        return showFormMsg('Tenés que ingresar una URL o ID de YouTube válido.');
      }

      if (!rawStart || !rawEnd) {
        return showFormMsg('Tenés que ingresar los tiempos de inicio y fin.');
      }

      const start = parseTime(rawStart);
      const end = parseTime(rawEnd);

      if (end <= start) {
        return showFormMsg(`El tiempo de fin (${formatTime(end)}) debe ser mayor al de inicio (${formatTime(start)}).`);
      }

      // Título automático si no se ingresó ninguno
      if (!title) {
        title = `Clip (${formatTime(start)} - ${formatTime(end)})`;
      }

      const clipData = { id, title, start, end, category };

      if (editIdx >= 0) {
        clips[editIdx] = clipData;
        showFormMsg('✓ Clip modificado correctamente en la lista.', false);
      } else {
        clips.push(clipData);
        showFormMsg('✓ Clip agregado. Recordá hacer clic en "Publicar Cambios" para guardarlo en GitHub.', false);
      }

      cancelEdit();
      renderAdminList();
    }

    function editClip(idx) {
      clearFormMsg();
      const c = clips[idx];
      document.getElementById('editing-index').value = idx;
      document.getElementById('form-mode-title').innerText = `✏️ Editando Clip #${idx + 1}`;
      document.getElementById('btn-submit').innerText = '✓ Guardar Cambios';
      document.getElementById('btn-cancel-edit').style.display = 'inline-block';

      document.getElementById('clip-title').value = c.title;
      document.getElementById('clip-url').value = `https://www.youtube.com/watch?v=${c.id}`;
      document.getElementById('clip-category').value = c.category || 'General';
      document.getElementById('clip-start').value = formatTime(c.start);
      document.getElementById('clip-end').value = formatTime(c.end);

      loadPreview();
    }

    function cancelEdit() {
      document.getElementById('editing-index').value = '-1';
      document.getElementById('form-mode-title').innerText = '2. Agregar o Editar Clip';
      document.getElementById('btn-submit').innerText = '➕ Guardar en Lista';
      document.getElementById('btn-cancel-edit').style.display = 'none';

      document.getElementById('clip-title').value = '';
      document.getElementById('clip-url').value = '';
      document.getElementById('clip-category').value = '';
      document.getElementById('clip-start').value = '';
      document.getElementById('clip-end').value = '';
    }

    function moveClip(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= clips.length) return;
      const item = clips.splice(idx, 1)[0];
      clips.splice(target, 0, item);
      renderAdminList();
    }

    function deleteClip(idx) {
      clips.splice(idx, 1);
      renderAdminList();
    }

    function renderAdminList() {
      document.getElementById('total-count').innerText = clips.length;
      const container = document.getElementById('clips-drag-list');
      if (clips.length === 0) {
        container.innerHTML = '<p style="color:#666;">No hay clips en la lista.</p>';
        return;
      }

      container.innerHTML = clips.map((c, i) => `
        <div class="clip-row" draggable="true" data-index="${i}">
          <div class="clip-data">
            <span style="color:#666; font-size:0.9rem;">☰</span>
            <div>
              <strong>${c.title}</strong>
              <div style="font-size:0.75rem; color:#aaa;">${formatTime(c.start)} a ${formatTime(c.end)} | <em>${c.category || 'General'}</em></div>
            </div>
          </div>
          <div class="clip-actions">
            <button class="btn-icon" onclick="moveClip(${i}, -1)">▲</button>
            <button class="btn-icon" onclick="moveClip(${i}, 1)">▼</button>
            <button class="btn-icon" onclick="editClip(${i})">✏️</button>
            <button class="btn-icon" style="color:#ff6b6b;" onclick="deleteClip(${i})">🗑️</button>
          </div>
        </div>
      `).join('');

      initDragEvents();
    }

    function initDragEvents() {
      const rows = document.querySelectorAll('.clip-row');
      let dragSrcIdx = null;

      rows.forEach(row => {
        row.addEventListener('dragstart', () => {
          dragSrcIdx = parseInt(row.getAttribute('data-index'));
          row.classList.add('dragging');
        });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => e.preventDefault());
        row.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetIdx = parseInt(row.getAttribute('data-index'));
          if (dragSrcIdx !== null && dragSrcIdx !== targetIdx) {
            const moved = clips.splice(dragSrcIdx, 1)[0];
            clips.splice(targetIdx, 0, moved);
            renderAdminList();
          }
        });
      });
    }

    async function loadClipsData() {
      const owner = localStorage.getItem('c_owner');
      const repo = localStorage.getItem('c_repo');
      const token = localStorage.getItem('c_token');

      if (!owner || !repo) {
        const r = await fetch('./clips.json?t=' + Date.now());
        clips = await r.json();
        renderAdminList();
        return;
      }

      try {
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/clips.json`, { headers });
        if (res.ok) {
          const data = await res.json();
          fileSha = data.sha;
          clips = JSON.parse(decodeURIComponent(escape(atob(data.content))));
          renderAdminList();
        }
      } catch (err) {
        console.error("Error al cargar:", err);
      }
    }

    async function syncWithGitHub() {
      const owner = localStorage.getItem('c_owner');
      const repo = localStorage.getItem('c_repo');
      const token = localStorage.getItem('c_token');
      const status = document.getElementById('sync-status');

      if (!owner || !repo || !token) {
        status.style.display = 'block';
        status.className = 'banner err';
        status.innerText = 'Configurá usuario, repositorio y token en el paso 1.';
        return;
      }

      status.style.display = 'block';
      status.className = 'banner';
      status.style.background = '#333';
      status.innerText = 'Publicando cambios en GitHub...';

      const jsonStr = JSON.stringify(clips, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

      try {
        const body = { message: "Actualizar lista de clips", content: base64Content };
        if (fileSha) body.sha = fileSha;

        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/clips.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          const resData = await res.json();
          fileSha = resData.content.sha;
          status.className = 'banner ok';
          status.innerText = '✓ ¡Sincronizado con éxito! El reproductor público ya tiene los cambios.';
        } else {
          const err = await res.json();
          status.className = 'banner err';
          status.innerText = `Error: ${err.message}`;
        }
      } catch (e) {
        status.className = 'banner err';
        status.innerText = `Fallo de conexión: ${e.message}`;
      }
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(clips, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'clips.json';
      a.click();
    }

    loadClipsData();
  </script>
</body>
</html>
